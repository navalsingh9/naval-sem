name: Build & Release NAVAL-SEM

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Default to least privilege
permissions:
  contents: read

concurrency:
  group: navalsem-release-main-sync
  cancel-in-progress: false

jobs:
  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows EXE + MSI
    runs-on: windows-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Inject version from tag
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if (-not ($version -match '^\d')) { $version = "dev" }
          (Get-Content app/version.py) -replace '_DEFAULT_APP_VERSION = ".*"', "_DEFAULT_APP_VERSION = `"$version`"" | Set-Content app/version.py
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Injected APP_VERSION=$version"

      - name: Build EXE
        run: uv run pyinstaller naval_sem.spec --clean --noconfirm

      - name: Add WiX 3 to PATH
        run: |
          $wixPath = Get-ChildItem "C:\Program Files (x86)" -Directory | Where-Object { $_.Name -like "WiX*" } | Select-Object -First 1 -ExpandProperty FullName
          echo "$wixPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "Found WiX at: $wixPath"

      - name: Create license.rtf
        run: |
          Set-Content -Path "installer\license.rtf" -Value "{\rtf1\ansi NAVAL-SEM is shareware. Free to use. Donations welcome to support development. No warranty is provided. Use at your own risk.}"

      - name: Build MSI
        run: |
          candle.exe installer\naval_sem.wxs -o installer\naval_sem.wixobj "-dProductVersion=$env:APP_VERSION"
          light.exe installer\naval_sem.wixobj -o dist\NAVAL-SEM-Setup.msi -ext WixUIExtension

      - name: Upload EXE artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-exe
          path: dist/NAVAL-SEM.exe

      - name: Upload MSI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msi
          path: dist/NAVAL-SEM-Setup.msi

  # ── macOS ──────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS .app + DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-14   # Apple Silicon
            arch: arm64
          - runner: macos-15-intel   # Intel
            arch: x86_64

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Inject version from tag
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == v* ]]; then VERSION="${VERSION#v}"; else VERSION="dev"; fi
          sed -i "" "s/^_DEFAULT_APP_VERSION = \".*\"$/_DEFAULT_APP_VERSION = \"${VERSION}\"/" app/version.py
          echo "Injected APP_VERSION=${VERSION}"

      - name: Build .app + DMG
        run: |
          chmod +x build_macos.sh
          bash build_macos.sh
          mv dist/NAVAL-SEM.dmg "dist/NAVAL-SEM-${{ matrix.arch }}.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: dist/NAVAL-SEM-${{ matrix.arch }}.dmg

  # ── Linux ──────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux Binary + .deb
    runs-on: ubuntu-22.04

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install system GTK/WebKit deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libgtk-3-0 \
            libwebkit2gtk-4.0-dev \
            python3-gi \
            python3-gi-cairo \
            gir1.2-webkit2-4.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Inject version from tag
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == v* ]]; then VERSION="${VERSION#v}"; else VERSION="dev"; fi
          sed -i "s/^_DEFAULT_APP_VERSION = \".*\"$/_DEFAULT_APP_VERSION = \"${VERSION}\"/" app/version.py
          echo "Injected APP_VERSION=${VERSION}"

      - name: Build binary
        run: uv run pyinstaller naval_sem.spec --clean --noconfirm

      - name: Build .deb
        run: |
          chmod +x build_linux.sh
          bash build_linux.sh

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-binary
          path: dist/NAVAL-SEM

      - name: Upload .deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-deb
          path: dist/naval-sem_*.deb

  # ── Release ────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/')

    # Only this job gets write permission
    permissions:
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # NOTE: this checkout was previously missing entirely, which meant the
      # release body below could never actually read CHANGELOG.md — there was
      # no repo checked out in this job to read it from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -lh release-assets/

      # NOTE: previously the "What's new" section of the release body was a
      # hardcoded block of bullets (fsQCA, APA export, NCA-ESSE, etc.) that
      # never changed between tags, so every release — including this one —
      # showed the same v1.0.0-era feature list. This step instead pulls the
      # section of CHANGELOG.md matching the tag being released, so the
      # release notes always reflect what's actually in that build. Falls
      # back to a generic pointer at CHANGELOG.md if no matching heading is
      # found (e.g. a workflow_dispatch run off a tag with no changelog entry
      # yet).
      - name: Extract changelog section for this tag
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PYEOF'
          import re
          import sys

          tag = sys.argv[1]

          with open("CHANGELOG.md", encoding="utf-8") as f:
              text = f.read()

          # Matches "## [v1.1.3] — 2026-08-01 · Title" (title/date optional)
          pattern = re.compile(
              rf"^## \[{re.escape(tag)}\].*?\n(.*?)(?=^## \[|\Z)",
              re.DOTALL | re.MULTILINE,
          )
          match = pattern.search(text)

          if match:
              section = match.group(1).strip()
          else:
              section = (
                  f"See [CHANGELOG.md](https://github.com/navalsingh9/naval-sem/blob/"
                  f"{tag}/CHANGELOG.md) for details on this release."
              )

          with open("release_notes_body.md", "w", encoding="utf-8") as f:
              f.write(section + "\n")
          PYEOF

      - name: Assemble full release body
        run: |
          {
            echo "## NAVAL-SEM ${{ github.ref_name }}"
            echo ""
            echo "Fully offline PLS-SEM / CB-SEM desktop application — no internet required after install."
            echo ""
            echo "**What's new in ${{ github.ref_name }}:**"
            echo ""
            cat release_notes_body.md
            echo ""
            echo "---"
            echo ""
            echo "### Downloads"
            echo ""
            echo "| Platform | File | Notes |"
            echo "|---|---|---|"
            echo "| Windows | \`NAVAL-SEM-Setup.msi\` | Recommended — installs with Start Menu + uninstall |"
            echo "| Windows | \`NAVAL-SEM.exe\` | Portable — drop anywhere and run |"
            echo "| macOS (Apple Silicon) | \`NAVAL-SEM-arm64.dmg\` | M1/M2/M3/M4 Macs — drag to Applications |"
            echo "| macOS (Intel) | \`NAVAL-SEM-x86_64.dmg\` | Intel Macs — drag to Applications |"
            echo "| Linux | \`naval-sem_*.deb\` | Debian/Ubuntu installer |"
            echo "| Linux | \`NAVAL-SEM\` | Portable binary |"
            echo ""
            echo "---"
            echo ""
            echo "### 💛 Support Development"
            echo "NAVAL-SEM is free to use. If you find it useful, please consider donating."
            echo "👉 https://www.paypal.com/paypalme/singhn9"
            echo ""
            echo "---"
            echo ""
            echo "### 🐛 Bug Reports & Feedback"
            echo "👉 https://forms.gle/N4AmCkJyCK6HHsZz8"
            echo ""
            echo "---"
            echo ""
            echo "### ⚠️ Windows Security Note"
            echo "Windows may show a SmartScreen warning on first run — click: More info → Run anyway"
            echo ""
            echo "### ⚠️ macOS Note"
            echo "Right-click → Open the first time to bypass Gatekeeper."
          } > full_release_body.md

      - name: Create release and upload assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: "NAVAL-SEM ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: full_release_body.md
          files: |
            release-assets/NAVAL-SEM.exe
            release-assets/NAVAL-SEM-Setup.msi
            release-assets/NAVAL-SEM-arm64.dmg
            release-assets/NAVAL-SEM-x86_64.dmg
            release-assets/NAVAL-SEM
            release-assets/naval-sem_*.deb
